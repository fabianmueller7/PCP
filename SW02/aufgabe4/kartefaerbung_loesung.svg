<svg viewBox="0 0 720 620" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="720" height="620" fill="#ffffff"/>
  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Kartenfärbung Zentralschweiz — einzige Lösung</text>
  <text x="360" y="50" text-anchor="middle" font-size="12" fill="#64748b">UR = gelb (vorgegeben), SZ = rot (vorgegeben)</text>

  <!-- Edges -->
  <g stroke="#64748b" stroke-width="2">
    <line x1="220" y1="230" x2="400" y2="350"/> <!-- LU-NW -->
    <line x1="220" y1="230" x2="250" y2="440"/> <!-- LU-OW -->
    <line x1="220" y1="230" x2="580" y2="310"/> <!-- LU-SZ -->
    <line x1="220" y1="230" x2="480" y2="160"/> <!-- LU-ZG -->
    <line x1="400" y1="350" x2="250" y2="440"/> <!-- NW-OW -->
    <line x1="400" y1="350" x2="580" y2="310"/> <!-- NW-SZ -->
    <line x1="400" y1="350" x2="430" y2="510"/> <!-- NW-UR -->
    <line x1="250" y1="440" x2="430" y2="510"/> <!-- OW-UR -->
    <line x1="580" y1="310" x2="430" y2="510"/> <!-- SZ-UR -->
    <line x1="580" y1="310" x2="480" y2="160"/> <!-- SZ-ZG -->
  </g>

  <!-- Nodes -->
  <g>
    <circle cx="220" cy="230" r="48" fill="#fbbf24" stroke="#1e293b" stroke-width="2"/>
    <text x="220" y="224" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">LU</text>
    <text x="220" y="244" text-anchor="middle" font-size="12" fill="#1e293b">gelb</text>
  </g>
  <g>
    <circle cx="480" cy="160" r="48" fill="#22c55e" stroke="#1e293b" stroke-width="2"/>
    <text x="480" y="154" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">ZG</text>
    <text x="480" y="174" text-anchor="middle" font-size="12" fill="#1e293b">grün</text>
  </g>
  <g>
    <circle cx="580" cy="310" r="48" fill="#ef4444" stroke="#1e293b" stroke-width="2"/>
    <text x="580" y="304" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">SZ</text>
    <text x="580" y="324" text-anchor="middle" font-size="12" fill="#ffffff">rot</text>
  </g>
  <g>
    <circle cx="400" cy="350" r="48" fill="#22c55e" stroke="#1e293b" stroke-width="2"/>
    <text x="400" y="344" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">NW</text>
    <text x="400" y="364" text-anchor="middle" font-size="12" fill="#1e293b">grün</text>
  </g>
  <g>
    <circle cx="250" cy="440" r="48" fill="#ef4444" stroke="#1e293b" stroke-width="2"/>
    <text x="250" y="434" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">OW</text>
    <text x="250" y="454" text-anchor="middle" font-size="12" fill="#ffffff">rot</text>
  </g>
  <g>
    <circle cx="430" cy="510" r="48" fill="#fbbf24" stroke="#1e293b" stroke-width="2"/>
    <text x="430" y="504" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">UR</text>
    <text x="430" y="524" text-anchor="middle" font-size="12" fill="#1e293b">gelb</text>
  </g>

  <text x="360" y="590" text-anchor="middle" font-size="13" fill="#334155">Prolog findet genau eine Lösung: UR=gelb, SZ=rot, NW=grün, OW=rot, LU=gelb, ZG=grün.</text>
</svg>
